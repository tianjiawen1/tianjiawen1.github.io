# Robot embodiments aligned into the Unified Action Space.
# Values mirror the LingBot-VLA 2.0 page exactly.
# id:    slug (stable identifier)
# img:   exact filename uploaded under assets/img/robots_src/
# name:  display name
# type:  embodiment category (source `category`)
# ee:    end-effector type (source `eeType`)
# total: total degrees of freedom (source `totalDof`)
# freq:  policy frequency (source `policyFrequency`)
# dof:   active action components; each value is the DoF shown on hover
#        (keys must match the tags: Arm / EEF / Gripper / Move / Waist / Head / Hand)
